[package]
name = "espanso"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Cross-platform Text Expander written in Rust"
readme = "../README.md"

[features]
default = ["modulo", "native-tls"]

# These features control whether Espanso will use the native TLS functionality
# or not. On some platforms (currently Linux) we prefer vendoring the SSL
# logic used by the packages to avoid dependency issues.
# https://github.com/espanso/espanso/issues/1056
native-tls = ["espanso-package/default-tls"]
vendored-tls = ["espanso-package/rustls-tls"]

# If the wayland feature is enabled, all X11 dependencies will be dropped
# and only methods suitable for Wayland will be used
wayland = [
    "espanso-detect/wayland",
    "espanso-inject/wayland",
    "espanso-clipboard/wayland",
    "espanso-info/wayland",
]

# Compile modulo and all its dependencies (including wxWidgets). If you don't
# enable it, features like Forms and Search might not be available.
modulo = [
    "espanso-modulo",
    "espanso-clipboard/avoid-gdi",
    "espanso-ui/avoid-gdi",
]

[dependencies]
espanso-detect = { path = "../espanso-detect", version = "2.4.0" }
espanso-ui = { path = "../espanso-ui", version = "2.4.0" }
espanso-inject = { path = "../espanso-inject", version = "2.4.0" }
espanso-config = { path = "../espanso-config", version = "2.4.0" }
espanso-match = { path = "../espanso-match", version = "2.4.0" }
espanso-clipboard = { path = "../espanso-clipboard", version = "2.4.0" }
espanso-info = { path = "../espanso-info", version = "2.4.0" }
espanso-render = { path = "../espanso-render", version = "2.4.0" }
espanso-ipc = { path = "../espanso-ipc", version = "2.4.0" }
espanso-modulo = { path = "../espanso-modulo", version = "2.4.0", optional = true }
espanso-kvs = { path = "../espanso-kvs", version = "2.4.0" }
espanso-engine = { path = "../espanso-engine", version = "2.4.0" }
espanso-package = { path = "../espanso-package", version = "2.4.0" }
simplelog = "0.9.0"
log.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap = "3"
crossbeam.workspace = true
enum-as-inner = "0.3.3"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
log-panics = "2.0.0"
fs2 = "0.4.3"
serde_norway.workspace = true
fs_extra.workspace = true
dialoguer = "0.8.0"
colored = "2.0.0"
tempdir.workspace = true
notify = "4.0.17"
opener = "0.5.0"
sysinfo = "0.28.4"
rusqlite = { version = "0.29.0", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
widestring.workspace = true
windows.workspace = true
named_pipe = "0.4.1"
winreg = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.98"

[target.'cfg(target_os="macos")'.dependencies]
espanso-mac-utils = { path = "../espanso-mac-utils", version = "2.4.0" }

[target.'cfg(target_os="linux")'.dependencies]
caps = "0.5.2"
const_format = "0.2.14"
regex.workspace = true

[package.metadata.deb]
maintainer = "Auca Coyan <aucacoyan@gmail.com>"
depends = "$auto"
section = "utility"
license-file = ["../LICENSE", "1"]

[package.metadata.deb.variants.wayland]
depends = ["wl-clipboard", "$auto"]
maintainer-scripts = "scripts/debian/"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/espanso", dest = "/usr/local/bin/espanso", mode = "755" },
]
post_install_script = "setcap 'cap_dac_override+p' /usr/local/bin/espanso"
